<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Teal round base badge with hard shadow feel -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#11414B" stroke="#2F7684" stroke-width="4"/>
  <rect x="10" y="10" width="100" height="100" rx="24" fill="#0A2E36" />

  <!-- Chai Glass Outline in Marigold -->
  <path d="M42 58 L46 96 C46.5 99 49 101 52 101 L68 101 C71 101 73.5 99 74 96 L78 58 Z" fill="#FFB627" fill-opacity="0.15" stroke="#FFB627" stroke-width="4" stroke-linejoin="round"/>
  <!-- Glass fluting / ribs -->
  <line x1="50" y1="64" x2="52" y2="94" stroke="#FFB627" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="64" x2="60" y2="94" stroke="#FFB627" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="64" x2="68" y2="94" stroke="#FFB627" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Chai level line -->
  <path d="M44 70 C52 72 68 68 76 70" stroke="#FF7A59" stroke-width="3" stroke-linecap="round"/>

  <!-- Steaming Vapor Curled into Game Controller Outline -->
  <path d="M48 50 C48 38 40 32 46 22 C49 18 56 18 60 22 C64 18 71 18 74 22 C80 32 72 38 72 50" stroke="#FFB627" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Controller d-pad & button dots formed in the steam -->
  <circle cx="53" cy="27" r="2.5" fill="#FFB627"/>
  <circle cx="67" cy="27" r="2.5" fill="#FF7A59"/>
  <path d="M58 24 L62 24" stroke="#FFB627" stroke-width="2" stroke-linecap="round"/>
</svg>
